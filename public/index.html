<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // "ResizeObserver loop completed with undelivered notifications." is
      // a benign browser warning (the spec explicitly documents it as safe
      // -- the browser just defers the remaining notifications to the next
      // frame) that can fire when several independent ResizeObservers
      // (Monaco, React Flow, react-resizable-panels) all react to the same
      // rapid, continuous resize, e.g. dragging the JSON Visualizer page's
      // split-pane handle. Production builds never surface it to users,
      // but CRA's dev-mode error overlay treats any window 'error' event as
      // an uncaught runtime error and shows its red overlay for it. That
      // overlay's own listener is registered by the bundled dev-client
      // script, which always runs *after* this inline tag (it's injected
      // later in the document) -- so registering our narrowly-scoped guard
      // here, as the very first script on the page, is what lets
      // stopImmediatePropagation() actually keep this one specific message
      // from ever reaching it. No other error is affected.
      window.addEventListener("error", function (event) {
        if (
          typeof event.message === "string" &&
          event.message.indexOf("ResizeObserver loop") !== -1
        ) {
          event.stopImmediatePropagation();
        }
      });
    </script>
